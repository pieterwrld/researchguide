<script>
let currentLang = 'nl';

async function detectLang() {
  try {
    const r = await fetch('https://ipapi.co/json/', { signal: AbortSignal.timeout(2000) });
    const d = await r.json();
    if (!['NL','BE','SR'].includes(d.country_code)) setLang('en');
  } catch(e) {}
}

function setLang(lang) {
  currentLang = lang;
  document.documentElement.lang = lang;
  document.getElementById('btn-nl').classList.toggle('active', lang === 'nl');
  document.getElementById('btn-en').classList.toggle('active', lang === 'en');
  document.querySelectorAll('[data-nl]').forEach(el => {
    el.innerHTML = el.getAttribute('data-' + lang);
  });
}

detectLang();
</script>
